<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>C · Лист</title>
  <link rel="stylesheet" href="_shared.css" />
  <style>
    .main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 4px;
    }
    .sheet {
      width: 100%;
      background: var(--overlay);
      border: 1px solid var(--overlay-border);
      border-radius: 20px;
      padding: 28px 22px 24px;
      backdrop-filter: blur(8px);
    }
    .sheet-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 24px;
    }
    .sheet-head h2 { font-size: 1rem; font-weight: 600; }
    .sheet-head .pct { font-size: 0.85rem; color: var(--text-muted); }
    .center-row {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 20px;
    }
    .center-row .n { font-size: 3.8rem; font-weight: 300; line-height: 1; }
    .center-row .u { font-size: 0.85rem; color: var(--text-muted); max-width: 5rem; line-height: 1.3; }
    .mini-ring {
      width: 72px; height: 72px; margin-left: auto; flex-shrink: 0;
      border-radius: 50%;
      background: conic-gradient(var(--ring-fill) 0deg 79deg, var(--ring-track) 79deg 360deg);
      mask: radial-gradient(farthest-side, transparent 62%, #000 63%);
      -webkit-mask: radial-gradient(farthest-side, transparent 62%, #000 63%);
    }
    .split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      border-top: 1px solid var(--overlay-border);
      padding-top: 18px;
    }
    .split div .caption { margin-bottom: 4px; }
    .split .val { font-size: 1.35rem; font-weight: 500; }
    .split .sub { font-size: 0.72rem; color: var(--text-muted); }
    .upcoming {
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid var(--overlay-border);
      font-size: 0.82rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .upcoming .badge {
      width: 28px; height: 28px;
      border-radius: 8px;
      background: rgba(232, 168, 152, 0.5);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <a class="back" href="index.html">← Все прототипы</a>
  <div class="phone">
    <header class="topbar">
      <button class="icon-btn" type="button">⚙</button>
      <div class="topbar-center">Алексей<span>▾</span></div>
      <button class="icon-btn right" type="button">↗</button>
    </header>
    <div class="screen main">
      <article class="sheet">
        <div class="sheet-head">
          <h2>Служба</h2>
          <span class="pct">21%</span>
        </div>
        <div class="center-row">
          <span class="n">287</span>
          <span class="u"><span class="label-tap">дней до дембеля</span></span>
          <div class="mini-ring" aria-hidden="true"></div>
        </div>
        <div class="split">
          <div>
            <div class="caption">прошло</div>
            <div class="val">78</div>
            <div class="sub">дней · 2 мес.</div>
          </div>
          <div>
            <div class="caption">осталось</div>
            <div class="val">287</div>
            <div class="sub">дней · 9 мес.</div>
          </div>
        </div>
        <div class="upcoming">
          <span class="badge">🎂</span>
          <span>День рождения · через 12 дней</span>
        </div>
      </article>
    </div>
  </div>
</body>
</html>
