<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>G · Панель</title>
  <link rel="stylesheet" href="_shared.css" />
  <style>
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 16px;
    }
  </style>
</head>
<body>
  <a class="back" href="index.html">← Все прототипы</a>
  <div class="phone">
    <header class="topbar">
      <button class="icon-btn" type="button">⚙</button>
      <div class="topbar-center">Алексей<span>▾</span></div>
      <button class="icon-btn right" type="button">↗</button>
    </header>
    <div class="screen main">
      <article class="panel">
        <div class="panel-holiday">
          <span class="glyph">🎖</span>
          <div>
            <strong>День защитника Отечества</strong>
            <span>23 фев · через 12 дней</span>
          </div>
        </div>
        <div class="panel-body">
          <div class="panel-center">
            <div class="big">287</div>
            <div class="unit"><span class="label-tap">дней до дембеля</span></div>
          </div>
          <div class="segments">
            <span class="seg on"></span><span class="seg on"></span><span class="seg on"></span><span class="seg on"></span>
            <span class="seg"></span><span class="seg"></span><span class="seg"></span><span class="seg"></span>
            <span class="seg"></span><span class="seg"></span><span class="seg"></span><span class="seg"></span>
            <span class="seg"></span><span class="seg"></span><span class="seg"></span><span class="seg"></span>
            <span class="seg"></span><span class="seg"></span><span class="seg"></span><span class="seg"></span>
          </div>
          <div class="panel-stats">
            <div class="side">
              <div class="caption">прошло</div>
              <div class="val">78</div>
            </div>
            <div class="mid">21%</div>
            <div class="side">
              <div class="caption">осталось</div>
              <div class="val">287</div>
            </div>
          </div>
        </div>
      </article>
    </div>
  </div>
</body>
</html>
