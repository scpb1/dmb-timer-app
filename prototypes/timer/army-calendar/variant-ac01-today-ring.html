<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AC1 · Кольцо + баннер дня</title>
  <link rel="stylesheet" href="../_shared.css" />
  <link rel="stylesheet" href="../_app.css" />
  <link rel="stylesheet" href="_army.css" />
</head>
<body>
  <a class="back" href="index.html">← Армейский календарь</a>
  <p style="max-width:390px;font-size:12px;color:#5a524a;margin:0 0 8px;text-align:center;">
    Пример: 44-й день — «Зеркала 44 дпп» (как на постере)
  </p>
  <div class="phone app">
    <header class="topbar">
      <button class="icon-btn" type="button">⚙</button>
      <div class="topbar-center app-switcher">Алексей<small>▾</small></div>
      <button class="icon-btn right" type="button">↗</button>
    </header>
    <div class="screen app-stack" style="--app-gap:20px;">
      <div class="army-today-banner">
        <div class="kicker">Сегодня праздник</div>
        <div class="title">🪞 Зеркала 44 дпп</div>
        <div class="sub">«Каждый день — праздник» · пара 321 ддд</div>
      </div>
      <div class="app-ring-block">
        <div class="app-toggle">
          <span class="left">прошло</span><span></span><span class="right">осталось</span>
        </div>
        <svg data-app-ring data-size="280" data-thickness="32" data-count="100" data-filled="12" aria-hidden="true"></svg>
        <div class="app-ring-center">
          <span class="pct">12,1%</span>
          <span class="num">321</span>
          <span class="unit">дней до дембеля</span>
        </div>
      </div>
      <div class="app-stat-row">
        <div class="app-stat-card">
          <div class="title">ПРОШЛО</div>
          <div class="val">44</div>
          <div class="unit-label">дней</div>
        </div>
        <div class="app-stat-card">
          <div class="title">ОСТАЛОСЬ</div>
          <div class="val">321</div>
          <div class="unit-label">дней</div>
        </div>
      </div>
      <div class="app-upcoming">
        <div class="glyph">🪞</div>
        <div>
          <div class="name">Зеркала 55 дпп</div>
          <div class="meta">через 11 дней</div>
        </div>
      </div>
    </div>
  </div>
  <script src="../app-setup.js"></script>
</body>
</html>
