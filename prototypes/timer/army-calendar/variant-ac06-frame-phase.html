<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AC6 · Рамка + фаза</title>
  <link rel="stylesheet" href="../_shared.css" />
  <link rel="stylesheet" href="../_app.css" />
  <link rel="stylesheet" href="_army.css" />
  <style>
    .phase-line {
      font-size: 13px;
      color: var(--text);
      font-weight: 600;
      margin-top: 6px;
    }
    .phase-hint {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }
  </style>
</head>
<body>
  <a class="back" href="index.html">← Армейский календарь</a>
  <div class="phone app">
    <header class="topbar">
      <button class="icon-btn" type="button">⚙</button>
      <div class="topbar-center app-switcher">Алексей<small>▾</small></div>
      <button class="icon-btn right" type="button">↗</button>
    </header>
    <div class="screen app-stack">
      <div class="app-frame">
        <div class="num">111</div>
        <div class="unit">ддд</div>
        <div class="phase-line">🚧 Большой заборчик</div>
        <div class="phase-hint">фаза «хвост» · большие вехи</div>
        <div class="upcoming-line">
          <span>🪞</span>
          <span>Зеркала 99 ддд · через 12 дн.</span>
        </div>
      </div>
      <div class="app-stat-row">
        <div class="app-stat-card">
          <div class="title">ПРОШЛО</div>
          <div class="val">254</div>
          <div class="unit-label">дней</div>
        </div>
        <div class="app-stat-card">
          <div class="title">ОСТАЛОСЬ</div>
          <div class="val">111</div>
          <div class="unit-label">дней</div>
        </div>
      </div>
      <div class="app-upcoming">
        <div class="glyph">🪆</div>
        <div>
          <div class="name">Большие матрёшки</div>
          <div class="meta">88 ддд · через 23 дня</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
