<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>A · Шёпот</title>
  <link rel="stylesheet" href="_shared.css" />
  <style>
    .main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; }
    .ring-wrap { position: relative; width: 220px; height: 220px; }
    .ring {
      width: 100%; height: 100%;
      border-radius: 50%;
      background: conic-gradient(var(--ring-fill) 0deg 79deg, var(--ring-track) 79deg 360deg);
      mask: radial-gradient(farthest-side, transparent calc(100% - 6px), #000 calc(100% - 5px));
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 6px), #000 calc(100% - 5px));
    }
    .ring-center {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .big { font-size: 3.4rem; font-weight: 300; letter-spacing: -0.02em; line-height: 1; }
    .unit { font-size: 0.8rem; color: var(--text-muted); margin-top: 6px; }
    .stats-line {
      text-align: center;
      font-size: 0.9rem;
      color: var(--text-muted);
    }
    .stats-line strong { color: var(--text); font-weight: 600; }
    .dot { margin: 0 0.5rem; opacity: 0.4; }
    .hint {
      font-size: 0.78rem;
      color: var(--text-muted);
      text-align: center;
      max-width: 260px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <a class="back" href="index.html">← Все прототипы</a>
  <div class="phone">
    <header class="topbar">
      <button class="icon-btn" type="button" aria-label="Настройки">⚙</button>
      <div class="topbar-center">
        Алексей
        <span>служба · ▾</span>
      </div>
      <button class="icon-btn right" type="button" aria-label="Поделиться">↗</button>
    </header>
    <div class="screen main">
      <div class="ring-wrap">
        <div class="ring" aria-hidden="true"></div>
        <div class="ring-center">
          <div class="big">287</div>
          <div class="unit"><span class="label-tap">дней до дембеля</span></div>
        </div>
      </div>
      <p class="stats-line">
        <strong>78</strong> прошло<span class="dot">·</span><strong>287</strong> осталось
      </p>
      <p class="hint">День рождения через 12 дней — без отдельной плашки</p>
    </div>
  </div>
</body>
</html>
