<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920, initial-scale=1" />
  <title>TikTok · Видео 01 · zoomer cut</title>
  <style>
    @font-face {
      font-family: "DDD Sans";
      src: url("../../../assets/fonts/dmb-timer-sans.ttf") format("truetype");
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: "DDD Sans";
      src: url("../../../assets/fonts/dmb-timer-sans-Bold.ttf") format("truetype");
      font-weight: 700;
      font-display: swap;
    }
    @font-face {
      font-family: "Black Ops One";
      src: url("../../../assets/fonts/BlackOpsOne-Regular.otf") format("opentype");
      font-weight: 400;
      font-display: swap;
    }

    :root {
      --stage-w: 1080px;
      --stage-h: 1920px;
      --ink: #f5f3ff;
      --pink: #ff4d9d;
      --pink-glow: #ff7ebf;
      --mint: #3dffa8;
      --mint-glow: #7bffcf;
      --violet: #8b5cff;
      --cyan: #00e5ff;
      --brown: #3e3630;
      --cream: #fcf7df;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050508;
      font-family: "DDD Sans", system-ui, sans-serif;
    }

    .viewport {
      width: 100vw;
      height: 100vh;
      display: grid;
      place-items: center;
    }

    .stage {
      width: var(--stage-w);
      height: var(--stage-h);
      position: relative;
      overflow: hidden;
      transform-origin: center center;
      background: #08080f;
    }

    .grain {
      pointer-events: none;
      position: absolute;
      inset: -50%;
      z-index: 900;
      opacity: 0.14;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      animation: grain-shift 0.45s steps(2) infinite;
      mix-blend-mode: soft-light;
    }
    @keyframes grain-shift {
      0% { transform: translate(0, 0); }
      100% { transform: translate(-3%, 2%); }
    }

    .flash {
      pointer-events: none;
      position: absolute;
      inset: 0;
      z-index: 850;
      background: #fff;
      opacity: 0;
    }
    .flash.on {
      animation: flash-hit 0.22s ease-out forwards;
    }
    @keyframes flash-hit {
      0% { opacity: 0.55; }
      100% { opacity: 0; }
    }

    .scene {
      position: absolute;
      inset: 0;
      opacity: 0;
      transform: scale(1.04);
      pointer-events: none;
      transition: opacity 0.28s ease, transform 0.38s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .scene.is-active {
      opacity: 1;
      transform: scale(1);
      pointer-events: auto;
    }

    /* ——— Сцена 1 ——— */
    .scene-farewell {
      background: #0a0612;
    }

    .mesh {
      position: absolute;
      inset: -20%;
      background:
        radial-gradient(ellipse 55% 45% at 20% 15%, rgba(255, 77, 157, 0.55), transparent 55%),
        radial-gradient(ellipse 50% 40% at 85% 25%, rgba(139, 92, 255, 0.5), transparent 50%),
        radial-gradient(ellipse 60% 50% at 50% 90%, rgba(61, 255, 168, 0.25), transparent 55%),
        linear-gradient(180deg, #120818 0%, #0a0612 55%, #061018 100%);
      animation: mesh-drift 8s ease-in-out infinite alternate;
    }
    @keyframes mesh-drift {
      from { transform: scale(1) translate(0, 0); }
      to { transform: scale(1.06) translate(-2%, 1%); }
    }

    .grid-floor {
      position: absolute;
      left: -20%;
      right: -20%;
      bottom: -5%;
      height: 52%;
      background:
        linear-gradient(180deg, transparent, rgba(0, 229, 255, 0.08) 30%, rgba(255, 77, 157, 0.12) 100%),
        repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.06) 0 2px, transparent 2px 64px),
        repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.05) 0 2px, transparent 2px 64px);
      transform: perspective(520px) rotateX(58deg);
      transform-origin: center bottom;
      mask-image: linear-gradient(180deg, transparent 0%, #000 35%, #000 100%);
    }

    .sticker {
      position: absolute;
      font-size: 72px;
      filter: drop-shadow(0 8px 24px rgba(0, 0, 0, 0.45));
      animation: sticker-float 2.4s ease-in-out infinite;
    }
    .sticker.train-emoji {
      bottom: 46%;
      left: -5%;
      font-size: 120px;
    }
    .scene-farewell.is-active .sticker.train-emoji {
      animation: train-zoom 4.2s cubic-bezier(0.45, 0, 0.15, 1) forwards, sticker-float 2s ease-in-out infinite;
    }
    @keyframes train-zoom {
      0% { transform: translateX(0) scale(1); filter: drop-shadow(0 0 0 transparent); }
      40% { transform: translateX(720px) scale(1.15); filter: drop-shadow(-40px 0 30px rgba(0, 229, 255, 0.5)); }
      100% { transform: translateX(720px) scale(1.15); opacity: 0.4; }
    }
    @keyframes sticker-float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    .sticker.spark {
      top: 18%;
      right: 12%;
      font-size: 56px;
      animation-delay: 0.3s;
    }
    .sticker.pin {
      top: 22%;
      left: 10%;
      font-size: 48px;
      animation-delay: 0.6s;
    }

    .hero {
      position: absolute;
      bottom: 34%;
      width: 220px;
      height: 220px;
      filter: drop-shadow(0 0 28px rgba(255, 77, 157, 0.45));
    }
    .hero-pink { left: 10%; z-index: 3; }
    .hero-green {
      right: 12%;
      z-index: 2;
      filter: drop-shadow(0 0 28px rgba(61, 255, 168, 0.4));
    }

    .scene-farewell.is-active .hero-green {
      animation: green-go 5s cubic-bezier(0.35, 0, 0.2, 1) forwards;
    }
    @keyframes green-go {
      0%, 15% { transform: translate(0, 0) rotate(0deg); }
      50% { transform: translate(140px, -20px) rotate(8deg); }
      100% { transform: translate(320px, -10px) rotate(4deg); opacity: 0.25; }
    }
    .scene-farewell.is-active .hero-pink {
      animation: pink-wiggle 0.35s ease-in-out infinite;
    }
    @keyframes pink-wiggle {
      0%, 100% { transform: rotate(-2deg); }
      50% { transform: rotate(4deg); }
    }

    .tri-sticker {
      stroke: #fff;
      stroke-width: 8;
      stroke-linejoin: round;
      paint-order: stroke fill;
    }

    .caption-block {
      position: absolute;
      left: 50%;
      bottom: 11%;
      transform: translateX(-50%);
      text-align: center;
      width: 92%;
      z-index: 5;
    }
    .caption-block .tag {
      display: inline-block;
      margin-bottom: 18px;
      padding: 10px 22px;
      border-radius: 999px;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #0a0612;
      background: linear-gradient(90deg, var(--cyan), var(--pink));
      box-shadow: 0 0 40px rgba(255, 77, 157, 0.45);
      opacity: 0;
    }
    .scene-farewell.is-active .caption-block .tag {
      animation: pop-in 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s forwards;
    }
    .caption-block h1 {
      font-family: "Black Ops One", "DDD Sans", sans-serif;
      font-size: 78px;
      line-height: 0.95;
      letter-spacing: -0.03em;
      text-transform: lowercase;
      color: var(--ink);
      -webkit-text-stroke: 2px rgba(0, 0, 0, 0.35);
      text-shadow:
        4px 4px 0 var(--violet),
        0 0 48px rgba(255, 77, 157, 0.35);
    }
    .caption-block h1 .w {
      display: inline-block;
      opacity: 0;
      transform: translateY(40px) rotate(-6deg) scale(0.8);
    }
    .scene-farewell.is-active .caption-block h1 .w1 {
      animation: word-pop 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) 0.45s forwards;
    }
    .scene-farewell.is-active .caption-block h1 .w2 {
      animation: word-pop 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) 0.62s forwards;
    }
    .scene-farewell.is-active .caption-block h1 .w3 {
      animation: word-pop 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) 0.78s forwards;
      color: var(--pink-glow);
    }
    @keyframes word-pop {
      to { opacity: 1; transform: translateY(0) rotate(0deg) scale(1); }
    }
    @keyframes pop-in {
      from { opacity: 0; transform: scale(0.6); }
      to { opacity: 1; transform: scale(1); }
    }

    /* ——— Сцена 2 ——— */
    .scene-cry {
      background: #0f0a18;
    }
    .scene-cry .mesh {
      background:
        radial-gradient(ellipse 70% 50% at 50% 30%, rgba(139, 92, 255, 0.45), transparent 60%),
        radial-gradient(ellipse 50% 40% at 20% 80%, rgba(255, 77, 157, 0.35), transparent 55%),
        #0f0a18;
    }
    .scene-cry.is-active {
      animation: cam-shake 0.35s ease 0.05s;
    }
    @keyframes cam-shake {
      0%, 100% { transform: scale(1) translate(0, 0); }
      25% { transform: scale(1.01) translate(-8px, 4px); }
      50% { transform: scale(1.01) translate(6px, -3px); }
      75% { transform: scale(1) translate(4px, 2px); }
    }

    .cry-wrap {
      position: absolute;
      left: 50%;
      top: 42%;
      transform: translate(-50%, -50%);
      width: 340px;
      height: 340px;
    }
    .scene-cry.is-active .cry-wrap {
      animation: cry-bounce 0.55s ease-in-out infinite;
    }
    @keyframes cry-bounce {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      50% { transform: translate(-50%, -48%) scale(1.03); }
    }
    .scene-cry.is-active .cry-glow {
      animation: glow-pulse 1.2s ease-in-out infinite;
    }
    @keyframes glow-pulse {
      0%, 100% { opacity: 0.5; transform: scale(1); }
      50% { opacity: 0.85; transform: scale(1.08); }
    }
    .cry-glow {
      position: absolute;
      inset: -30%;
      background: radial-gradient(circle, rgba(255, 77, 157, 0.55), transparent 65%);
      z-index: 0;
    }

    .emoji-rain {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .emoji-rain span {
      position: absolute;
      font-size: 44px;
      opacity: 0;
      animation: emoji-fall 1.4s linear infinite;
    }
    .scene-cry.is-active .emoji-rain span:nth-child(1) { left: 18%; animation-delay: 0s; }
    .scene-cry.is-active .emoji-rain span:nth-child(2) { left: 42%; animation-delay: 0.35s; font-size: 36px; }
    .scene-cry.is-active .emoji-rain span:nth-child(3) { left: 68%; animation-delay: 0.7s; }
    .scene-cry.is-active .emoji-rain span:nth-child(4) { left: 82%; animation-delay: 0.15s; font-size: 52px; }
    @keyframes emoji-fall {
      0% { opacity: 0; transform: translateY(-40px) rotate(0deg); }
      15% { opacity: 1; }
      100% { opacity: 0; transform: translateY(420px) rotate(25deg); }
    }

    .cry-caption {
      position: absolute;
      left: 50%;
      bottom: 14%;
      transform: translateX(-50%);
      text-align: center;
    }
    .cry-caption .big {
      font-family: "Black Ops One", sans-serif;
      font-size: 64px;
      text-transform: lowercase;
      background: linear-gradient(90deg, #fff, var(--pink-glow));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 0 20px rgba(255, 77, 157, 0.5));
    }
    .cry-caption .small {
      margin-top: 12px;
      font-size: 26px;
      color: rgba(245, 243, 255, 0.55);
      letter-spacing: 0.02em;
    }

    /* ——— Сцена 3 ——— */
    .scene-phone {
      background: #050508;
    }
    .aurora {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 30% 20%, rgba(139, 92, 255, 0.35), transparent 50%),
        radial-gradient(ellipse 70% 50% at 70% 60%, rgba(255, 77, 157, 0.25), transparent 55%),
        #050508;
    }
    .scene-phone.is-active .phone-float {
      animation: phone-float 2.8s ease-in-out infinite;
    }
    @keyframes phone-float {
      0%, 100% { transform: translateY(0) rotate(-1deg); }
      50% { transform: translateY(-14px) rotate(1deg); }
    }

    .phone-float {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding-bottom: 80px;
    }

    .device {
      width: 540px;
      padding: 12px;
      border-radius: 52px;
      background: linear-gradient(145deg, #eaeaea 0%, #9a9a9a 35%, #f5f5f5 55%, #6a6a6a 100%);
      box-shadow:
        0 0 0 2px rgba(255, 255, 255, 0.25),
        0 50px 100px rgba(0, 0, 0, 0.65),
        0 0 80px rgba(139, 92, 255, 0.25);
    }
    .device-screen {
      border-radius: 42px;
      overflow: hidden;
      aspect-ratio: 9 / 19.5;
      position: relative;
      background: #000;
    }
    .screen-layer {
      position: absolute;
      inset: 0;
      transition: opacity 0.22s ease, transform 0.38s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .screen-home { z-index: 2; opacity: 1; transform: scale(1); }
    .screen-timer { z-index: 1; opacity: 0; transform: scale(1.08); }
    .scene-phone.phase-timer .screen-home {
      opacity: 0;
      transform: scale(0.88);
    }
    .scene-phone.phase-timer .screen-timer {
      opacity: 1;
      transform: scale(1);
      z-index: 4;
    }
    .scene-phone.phase-timer .open-burst {
      animation: burst 0.45s ease-out forwards;
    }
    @keyframes burst {
      0% { opacity: 0.7; transform: scale(0.3); }
      100% { opacity: 0; transform: scale(2.2); }
    }
    .open-burst {
      position: absolute;
      inset: 0;
      margin: auto;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.5), transparent 70%);
      pointer-events: none;
      z-index: 20;
      opacity: 0;
    }

    .dynamic-island {
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      width: 118px;
      height: 34px;
      background: #000;
      border-radius: 20px;
      z-index: 8;
    }

    .status-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 52px;
      padding: 16px 24px 0;
      display: flex;
      justify-content: space-between;
      font-size: 15px;
      font-weight: 700;
      z-index: 7;
      color: #fff;
    }
    .status-bar.dark { color: #f5f3ff; }

    .home-bg {
      position: absolute;
      inset: 0;
      background:
        url("data:image/svg+xml,%3Csvg width='60' height='60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 30h60M30 0v60' stroke='rgba(255,255,255,0.04)'/%3E%3C/svg%3E"),
        linear-gradient(165deg, #1a1030 0%, #2d1855 35%, #ff4d9d 120%);
    }

    .home-grid {
      position: absolute;
      inset: 0;
      padding: 78px 26px 130px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 26px 14px;
      align-content: start;
    }
    .app {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .app .bubble {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      font-size: 28px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .app .bubble img {
      width: 100%;
      height: 100%;
      border-radius: 18px;
      object-fit: cover;
    }
    .app span {
      font-size: 10px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.92);
      text-align: center;
      max-width: 76px;
      line-height: 1.15;
    }
    .app-ddd { position: relative; }
    .app-ddd .bubble {
      box-shadow: 0 0 0 2px rgba(255, 77, 157, 0.6), 0 8px 28px rgba(255, 77, 157, 0.35);
    }
    .tap-flash {
      position: absolute;
      inset: -14px;
      border-radius: 24px;
      border: 3px solid #fff;
      opacity: 0;
      pointer-events: none;
    }
    .scene-phone.phase-tap .app-ddd .tap-flash {
      animation: tap-flash 0.5s ease forwards;
    }
    @keyframes tap-flash {
      0% { opacity: 0; transform: scale(0.7); }
      40% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(1.2); }
    }

    .dock {
      position: absolute;
      left: 18px;
      right: 18px;
      bottom: 28px;
      height: 88px;
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      display: flex;
      align-items: center;
      justify-content: space-evenly;
      padding: 0 12px;
    }
    .dock .bubble { width: 56px; height: 56px; border-radius: 16px; }

    .timer-ui {
      position: absolute;
      inset: 0;
      background: #0a0a0f;
      padding: 58px 22px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .timer-ui::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 50% at 50% 0%, rgba(139, 92, 255, 0.35), transparent 55%),
        radial-gradient(ellipse 60% 40% at 80% 100%, rgba(255, 77, 157, 0.2), transparent 50%);
      pointer-events: none;
    }
    .timer-head {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1;
    }
    .timer-head h2 {
      font-size: 20px;
      font-weight: 700;
      color: #f5f3ff;
    }
    .pill-live {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(61, 255, 168, 0.15);
      color: var(--mint);
      border: 1px solid rgba(61, 255, 168, 0.35);
    }
    .ring-box {
      position: relative;
      width: 300px;
      height: 300px;
      margin: 20px 0 24px;
      z-index: 1;
    }
    .ring-box svg { width: 100%; height: 100%; }
    .ring-glow {
      position: absolute;
      inset: 10%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 77, 157, 0.25), transparent 70%);
      filter: blur(8px);
    }
    .timer-mid {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .timer-mid .pct {
      font-family: "Black Ops One", sans-serif;
      font-size: 48px;
      background: linear-gradient(90deg, #fff, var(--cyan));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .timer-mid .unit {
      margin-top: 4px;
      font-size: 14px;
      color: rgba(245, 243, 255, 0.5);
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }
    .stats-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: 100%;
      max-width: 360px;
      z-index: 1;
    }
    .stat-glass {
      padding: 16px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
    }
    .stat-glass .lbl {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: rgba(245, 243, 255, 0.45);
    }
    .stat-glass .num {
      margin-top: 6px;
      font-size: 32px;
      font-weight: 700;
      color: #fff;
    }
    .scene-phone.is-active .ring-progress {
      animation: ring-draw 1s cubic-bezier(0.22, 1, 0.36, 1) 0.1s both;
    }
    @keyframes ring-draw {
      from { stroke-dashoffset: 520; }
      to { stroke-dashoffset: 330; }
    }

    .hands-hint {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 45%;
      background: linear-gradient(180deg, transparent, rgba(255, 77, 157, 0.15));
      pointer-events: none;
    }

    .hud {
      position: fixed;
      left: 12px;
      bottom: 12px;
      z-index: 9999;
      font: 12px/1.4 monospace;
      color: rgba(255, 255, 255, 0.45);
      display: none;
    }
    body.debug .hud { display: block; }
  </style>
</head>
<body>
  <div class="viewport">
    <div class="stage" id="stage">
      <div class="grain" aria-hidden="true"></div>
      <div class="flash" id="flash" aria-hidden="true"></div>

      <section class="scene scene-farewell is-active" data-scene="farewell" aria-hidden="false">
        <div class="mesh"></div>
        <div class="grid-floor"></div>
        <span class="sticker pin" aria-hidden="true">📍</span>
        <span class="sticker spark" aria-hidden="true">✨</span>
        <span class="sticker train-emoji" aria-hidden="true">🚄</span>

        <div class="hero hero-pink">
          <svg viewBox="0 0 220 220" width="220" height="220" aria-hidden="true">
            <defs>
              <linearGradient id="gPink" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#ff7ebf"/>
                <stop offset="100%" stop-color="#ff4d9d"/>
              </linearGradient>
            </defs>

  <script>
    const TIMELINE = [
      { id: "farewell", ms: 5000 },
      { id: "cry", ms: 3000 },
      { id: "phone", ms: 9000 },
    ];
    const PHONE_TAP_AT = 2600;
    const PHONE_OPEN_AT = 3200;

    const stage = document.getElementById("stage");
    const scenes = [...document.querySelectorAll(".scene")];
    const phoneScene = document.querySelector(".scene-phone");
    const flash = document.getElementById("flash");
    const hud = document.getElementById("hud");
    let lastScene = "farewell";

    if (new URLSearchParams(location.search).has("debug")) {
      document.body.classList.add("debug");
    }

    function fitStage() {
      const scale = Math.min(window.innerWidth / 1080, window.innerHeight / 1920);
      stage.style.transform = `scale(${scale})`;
    }
    window.addEventListener("resize", fitStage);
    fitStage();

    function triggerFlash() {
      flash.classList.remove("on");
      void flash.offsetWidth;
      flash.classList.add("on");
    }

    function setScene(id) {
      if (id !== lastScene) {
        if (id === "cry" || id === "phone") triggerFlash();
        lastScene = id;
      }
      scenes.forEach((el) => {
        const on = el.dataset.scene === id;
        el.classList.toggle("is-active", on);
        el.setAttribute("aria-hidden", on ? "false" : "true");
      });
      phoneScene.classList.remove("phase-tap", "phase-timer");
    }

    function runPhonePhases(tPhoneStart) {
      const elapsed = performance.now() - tPhoneStart;
      phoneScene.classList.toggle("phase-tap", elapsed >= PHONE_TAP_AT && elapsed < PHONE_OPEN_AT + 350);
      phoneScene.classList.toggle("phase-timer", elapsed >= PHONE_OPEN_AT);
    }

    let runId = 0;

    function play() {
      const id = ++runId;
      lastScene = "";
      const tStart = performance.now();

      function tick() {
        if (id !== runId) return;
        const elapsed = performance.now() - tStart;
        let acc = 0;
        let current = TIMELINE[0].id;
        for (const part of TIMELINE) {
          if (elapsed < acc + part.ms) {
            current = part.id;
            break;
          }
          acc += part.ms;
          current = part.id;
        }
        setScene(current);
        if (current === "phone") runPhonePhases(tStart + acc);
        if (document.body.classList.contains("debug")) {
          hud.textContent = `${(elapsed / 1000).toFixed(2)}s · ${current}`;
        }
        const total = TIMELINE.reduce((s, p) => s + p.ms, 0);
        if (elapsed < total) requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    }

    document.addEventListener("keydown", (e) => {
      if (e.code === "Space") {
        e.preventDefault();
        play();
      }
    });
    window.addEventListener("load", play);
  </script>
